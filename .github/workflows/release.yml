name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: netease-toolkit

jobs:
  # ── Build matrix (3 platforms) ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-type: nsis
            bundle-suffix: x64-setup.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            bundle-type: dmg
            bundle-suffix: x86_64.dmg

          - os: macos-latest
            target: aarch64-apple-darwin
            bundle-type: dmg
            bundle-suffix: aarch64.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build with Tauri
        shell: bash
        run: |
          npm run tauri -- build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundle-type }}

      - name: Rename bundle
        id: rename
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle-type }}"

          SRC_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f \
            -name "*.${{ matrix.bundle-type == 'nsis' && 'exe' || 'dmg' }}" \
            | head -n 1)
          if [ -z "$SRC_FILE" ]; then
            echo "::error::Bundle not found in $BUNDLE_DIR"
            exit 1
          fi

          DEST_FILE="${APP_NAME}_${VERSION}_${{ matrix.bundle-suffix }}"
          mv "$SRC_FILE" "$DEST_FILE"
          echo "artifact_path=$DEST_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ env.APP_NAME }}_*

  # ── Create GitHub Release ──
  create-release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            ### Downloads

            | Platform | Asset |
            |---|---|
            | Windows x64 | `${{ env.APP_NAME }}_${{ steps.version.outputs.version }}_x64-setup.exe` |
            | macOS Intel | `${{ env.APP_NAME }}_${{ steps.version.outputs.version }}_x86_64.dmg` |
            | macOS Apple Silicon | `${{ env.APP_NAME }}_${{ steps.version.outputs.version }}_aarch64.dmg` |

            > Source archives (.zip, .tar.gz) are auto-generated by GitHub.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            bundle-*/${{ env.APP_NAME }}_*
