[package]
name = "netease-toolkit"
version = "1.0.0"
description = "NetEase Music Toolkit"
authors = ["jiandan"]
edition = "2021"

[lib]
name = "netease_toolkit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "netease-toolkit"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
aes = "0.8"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
cbc = "0.1"
hex = "0.4"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
id3 = "1"
mp4ameta = "0.13"
anyhow = "1"
symphonia = { version = "0.6", features = ["mp3", "flac", "isomp4", "aac"] }
mp3lame-encoder = "0.2"
fdk-aac = "0.8"
mp4 = "0.14"
bytes = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
